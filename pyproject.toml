[project]
name = "meyno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ChaoticDefense", email = "supersonicseven@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.19,<1.20",
    "sqlalchemy>=2.0,<2.1",
]

[project.scripts]
meyno = "meyno:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0,<10.0",
    "ruff",
]

[tool.ruff]
extend-exclude = ["alembic"]
